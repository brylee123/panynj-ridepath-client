[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panynj-ridepath-client"
version = "0.2.0"
description = "Independent asynchronous client for the public PANYNJ RidePATH JSON feed"
readme = "README.md"
authors = [{name = "Barry Lee"}]
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.14", "Framework :: AsyncIO", "Typing :: Typed"]
requires-python = ">=3.14.2"
dependencies = ["aiohttp>=3.12,<4"]
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panynj_ridepath = ["py.typed"]

[project.urls]
Homepage = "https://github.com/brylee123/panynj-ridepath-client"
Issues = "https://github.com/brylee123/panynj-ridepath-client/issues"
Source = "https://github.com/brylee123/panynj-ridepath-client"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1", "pytest-aiohttp>=1", "ruff>=0.14"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
